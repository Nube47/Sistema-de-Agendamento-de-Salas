<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento de Salas</title>

   
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

   
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div>
                    <h1>Sistema de Agendamento</h1>
                    <p>Gerenciamento de salas e laboratórios</p>
                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#modalAgendamento"
                >
                    + Novo Agendamento
                </button>
            </div>
        </div>
    </header>


    <main class="container py-4">

        <section class="mb-4">

            <h2 class="section-title">Resumo</h2>

            <div class="row g-3">

                <div class="col-md-4">
                    <div class="card metric-card">
                        <div class="card-body">
                            <span class="metric-label">Total de Reservas</span>
                            <h3 id="totalReservas">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card metric-card">
                        <div class="card-body">
                            <span class="metric-label">Manhã</span>
                            <h3 id="totalManha">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card metric-card">
                        <div class="card-body">
                            <span class="metric-label">Tarde / Noite</span>
                            <h3 id="totalOutrosTurnos">0</h3>
                        </div>
                    </div>
                </div>

            </div>

        </section>


       
        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="section-title">Filtros de Busca</h2>

                <div class="row g-3">

                   
                    <div class="col-md-6 col-lg-3">
                        <label for="filtroSolicitante" class="form-label">
                            Solicitante
                        </label>

                        <input
                            type="text"
                            id="filtroSolicitante"
                            class="form-control"
                            placeholder="Nome do solicitante"
                        >
                    </div>


                    <div class="col-md-6 col-lg-3">
                        <label for="filtroData" class="form-label">
                            Data
                        </label>

                        <input
                            type="date"
                            id="filtroData"
                            class="form-control"
                        >
                    </div>


                 
                    <div class="col-md-6 col-lg-3">
                        <label for="filtroBloco" class="form-label">
                            Bloco
                        </label>

                        <select id="filtroBloco" class="form-select">
                            <option value="">Todos os blocos</option>
                        </select>
                    </div>


                  
                    <div class="col-md-6 col-lg-3">
                        <label for="filtroSala" class="form-label">
                            Sala
                        </label>

                        <select id="filtroSala" class="form-select">
                            <option value="">Todas as salas</option>
                        </select>
                    </div>

                </div>

            </div>

        </section>


        
        <section>

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h2 class="section-title mb-0">
                    Reservas
                </h2>

                <span class="badge text-bg-primary" id="contadorReservas">
                    0 reservas
                </span>

            </div>


            <div
                id="alertaVazio"
                class="alert alert-info text-center d-none"
                role="alert"
            >
                Ainda não foram realizadas reservas de salas.
            </div>


           
            <div id="areaTabela" class="card shadow-sm">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-dark">

                            <tr>
                                <th>Solicitante</th>
                                <th>Bloco</th>
                                <th>Sala</th>
                                <th>Data</th>
                                <th>Turno</th>
                                <th class="text-center">Ação</th>
                            </tr>

                        </thead>

                        <tbody id="listaReservas">


                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    
    <div
        class="modal fade"
        id="modalAgendamento"
        tabindex="-1"
        aria-labelledby="tituloModal"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h2 class="modal-title fs-5" id="tituloModal">
                        Novo Agendamento
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                    ></button>

                </div>


                <form id="formAgendamento">

                    <div class="modal-body">

                        <div
                            id="alertaFormulario"
                            class="alert alert-danger d-none"
                            role="alert"
                        ></div>


                      
                        <div class="mb-3">

                            <label
                                for="solicitante"
                                class="form-label"
                            >
                                Nome do Solicitante
                            </label>

                            <input
                                type="text"
                                id="solicitante"
                                class="form-control"
                                placeholder="Digite o nome"
                                required
                            >

                        </div>


                     
                        <div class="mb-3">

                            <label
                                for="bloco"
                                class="form-label"
                            >
                                Bloco
                            </label>

                            <select
                                id="bloco"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    Selecione o bloco
                                </option>
                            </select>

                        </div>


                        <div class="mb-3">

                            <label
                                for="sala"
                                class="form-label"
                            >
                                Sala
                            </label>

                            <select
                                id="sala"
                                class="form-select"
                                required
                                disabled
                            >
                                <option value="">
                                    Selecione primeiro o bloco
                                </option>
                            </select>

                        </div>


                        
                        <div class="mb-3">

                            <label
                                for="data"
                                class="form-label"
                            >
                                Data da Reserva
                            </label>

                            <input
                                type="date"
                                id="data"
                                class="form-control"
                                required
                            >

                        </div>


                       
                        <div class="mb-3">

                            <label
                                for="turno"
                                class="form-label"
                            >
                                Turno
                            </label>

                            <select
                                id="turno"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Selecione o turno
                                </option>

                                <option value="Manhã">
                                    Manhã
                                </option>

                                <option value="Tarde">
                                    Tarde
                                </option>

                                <option value="Noite">
                                    Noite
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Salvar Agendamento
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


   
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

   
    <script type="module" src="js/main.js"></script>

</body>

</html>
